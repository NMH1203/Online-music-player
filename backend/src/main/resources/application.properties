# Cấu hình kết nối cổng database Postgres (Sử dụng đúng cổng map mà bạn chạy Docker thành công)
spring.datasource.url=jdbc:postgresql://localhost:5439/music_player
spring.datasource.username=music_app
spring.datasource.password=music_app
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình cổng chạy ứng dụng Backend khi bật lên
server.port=8080
