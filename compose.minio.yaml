name: music-player-storage

services:
  minio:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z
    restart: unless-stopped
    command: ["minio", "server", "/data", "--console-address", ":9001", "--license", "/minio.license"]
    env_file:
      - ./storage/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run scripts/Setup-Minio.ps1 first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/Setup-Minio.ps1 first}
      MINIO_SITE_REGION: ${MINIO_REGION:-us-east-1}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - type: bind
        source: ./storage/minio.license
        target: /minio.license
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  minio_data:
