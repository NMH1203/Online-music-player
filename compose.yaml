name: music-player
services:
  db:
    image: postgres:16.13-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-music_player}
      POSTGRES_USER: ${POSTGRES_USER:-music_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-music_local_dev_only}
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT:-5439}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s
  migrate:
    image: redgate/flyway:11.20.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-music_player}
      FLYWAY_USER: ${POSTGRES_USER:-music_app}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-music_local_dev_only}
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_LOCATIONS: filesystem:/flyway/migrations
    command: migrate
    volumes:
      - type: bind
        source: ./database/migrations
        target: /flyway/migrations
        read_only: true
        bind:
          create_host_path: false
volumes:
  postgres_data:
